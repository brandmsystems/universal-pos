; TRANSACTION-mode pooling. This is the only mode the application may run under.
;
; SET LOCAL is scoped to a transaction, so a pooler that hands a server
; connection to another client mid-transaction -- or that never keeps one across
; statements at all -- discards it. app.current_tenant_id() then raises on every
; query and RLS is inert. The startup probe checks this functionally on every
; boot rather than trusting this file.
[databases]
; No auth_user, and therefore no auth_query: an auth_query means giving the
; pooler a role that can read pg_authid. The userlist is the whole credential
; surface, and it holds the same three application roles and nothing else.
katkitchen = host=postgres port=5432 dbname=katkitchen
katkitchen_test = host=postgres port=5432 dbname=katkitchen_test

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
default_pool_size = 20

; A server connection must be clean between transactions, or a leaked GUC would
; carry one tenant's context into another tenant's request. The probe asserts
; this rather than assuming it.
server_reset_query = DISCARD ALL
server_reset_query_always = 1

ignore_startup_parameters = extra_float_digits,options
admin_users = katkitchen_owner
logfile =
pidfile =
