server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The pages are always re-checked (no-cache: revalidate, a 304 when unchanged),
  # so a deploy reaches every browser on its next load. Without it a browser may
  # keep an old page by its own guess and never ask for the new bundle. The
  # bundle files are named by their content hash, so they are cached for good.
  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # A single-page app: every unknown path is the app, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # The API is proxied on the same origin so the client only ever knows relative
  # paths -- the alternative is CORS plus an origin baked into the build, which
  # makes one artefact per environment.
  # The Super Admin console: /superadmin and /superadmin/{section} -> the ONE
  # control-plane document, platform.html. FIRST among the regexes on purpose --
  # nginx takes the first match, and /superadmin/{section} is slug-shaped.
  # `superadmin` is a reserved slug (@universalpos/shared SUPERADMIN_SEGMENT).
  location ~ "^/superadmin(/[a-z][a-z-]*)?/?$" {
    try_files /platform.html =404;
    add_header Cache-Control "no-cache";
  }

  # ###########################################################################
  # A RESTAURANT'S OWN ADDRESS: /{slug} -> the restaurant app.
  #
  # Same pattern as the `tenant_slug_format` CHECK. A single path segment with no
  # dot, so /index.html, /admin.html and /assets/... never match, and neither does
  # /api/... (it has a second segment). The app reads the slug from the address
  # and asks the API for that restaurant; an unknown slug shows "Restaurant not
  # found". Top-level names the site uses are reserved slugs (@universalpos/shared),
  # so no restaurant can shadow them.
  # ###########################################################################
  location ~ "^/[a-z0-9][a-z0-9-]{1,62}/?$" {
    try_files $uri /admin.html;
    add_header Cache-Control "no-cache";
  }

  # Each restaurant's own tablet pages. The app reads the slug from the address,
  # looks the restaurant up, and keeps the tablet's identity under that slug --
  # so a tablet set up for one restaurant can never open as another.
  # The POS -- Dine-in, Parcel, KOT and Billing on one sign-in -- at /pos, the one
  # link a restaurant is given. /kot and /billing were earlier addresses and open
  # the same document (Billing on its tab), so a bookmarked till keeps working; a
  # till's identity is stored per restaurant, not per path.
  location ~ "^/[a-z0-9][a-z0-9-]{1,62}/(pos|kot|billing)/?$" {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  # A restaurant admin screen: /{slug}/{section} (/{slug}/menu, /{slug}/staff).
  # AFTER the tablet pages on purpose -- nginx takes the first matching regex,
  # so /{slug}/pos, /kot and /billing never reach this. Which sections
  # exist is the admin app's to say; an unknown one shows the dashboard.
  location ~ "^/[a-z0-9][a-z0-9-]{1,62}/[a-z][a-z-]*/?$" {
    try_files $uri /admin.html;
    add_header Cache-Control "no-cache";
  }

  # `^~`: a prefix match that stops the regex search, so no slug-shaped regex
  # above (`/{slug}/{section}` matches `/api/public`) can shadow the API.
  #
  # The upstream is a VARIABLE, re-resolved through the container's own DNS
  # resolver: a hostname written straight into proxy_pass is resolved once at
  # startup, and Render gives a redeployed API a new address -- so the web would
  # keep proxying to a dead one. API_SCHEME, API_UPSTREAM (host[:port]) and
  # NGINX_LOCAL_RESOLVERS are filled in by the nginx image's entrypoint; an
  # unset one leaves its literal in place and nginx refuses to start.
  #
  # The scheme is separate because a FREE Render instance cannot receive
  # private-network traffic: there the API is reached at its public https
  # address, and Host must name the API, or Render's edge cannot route it.
  # The API itself never reads Host.
  location ^~ /api/ {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_upstream ${API_SCHEME}://${API_UPSTREAM};
    proxy_pass $api_upstream;
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Request-Id $request_id;
    # The kitchen display is server-sent events, held open for a whole service.
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 1h;
  }
}
